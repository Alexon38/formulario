<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo</title>
</head>

<header>
    <h1>Formulário de Cadastro</h1>
</header>


<main>
    <form id="cadastroForm">
        <!-- Nome completo -->
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <!-- E-mail -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>

        <!-- Idade -->
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Sua idade" required>

        <!-- Data de nascimento -->
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <!-- Estado Civil (Dropdown) -->
        <label for="estadoCivil">Estado Civil:</label>
        <select id="estadoCivil" name="estadoCivil" required>
            <option value="">Selecione...</option>
            <option value="Solteiro(a)">Solteiro(a)</option>
            <option value="Casado(a)">Casado(a)</option>
            <option value="Divorciado(a)">Divorciado(a)</option>
            <option value="Viúvo(a)">Viúvo(a)</option>
        </select>

        <!-- Gênero (Radio Buttons) -->
        <label>Gênero:</label>
        <div class="radio-group">
            <input type="radio" id="masculino" name="genero" value="Masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="genero" value="Feminino">
            <label for="feminino">Feminino</label>
            <input type="radio" id="outro" name="genero" value="Outro">
            <label for="outro">Outro</label>
        </div>

        <!-- Checkbox -->
        <div class="checkbox-group">
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Aceito os termos e condições</label>
        </div>

        <button type="submit">Enviar Formulário</button>
    </form>


    <script>
        const form = document.getElementById('cadastroForm');
        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Impede o recarregamento da página

            // Capturando os valores
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const idade = document.getElementById('idade').value;
            const nascimento = document.getElementById('nascimento').value;
            const estadoCivil = document.getElementById('estadoCivil').value;

            // Radio buttons
            let genero = '';
            const radios = document.getElementsByName('genero');
            for (let radio of radios) {
                if (radio.checked) {
                    genero = radio.value;
                    break;
                }
            }


            const termosAceitos = document.getElementById('termos').checked ? 'Sim' : 'Não';
            // Construindo a mensagem
            let mensagem = `✅ Formulário enviado com sucesso!\n\n`;
            mensagem += `📋 Dados Informados:\n\n`;
            mensagem += `Nome Completo: ${nome}\n`;
            mensagem += `E-mail: ${email}\n`;
            mensagem += `Idade: ${idade} anos\n`;
            mensagem += `Data de Nascimento: ${nascimento}\n`;
            mensagem += `Estado Civil: ${estadoCivil}\n`;
            mensagem += `Gênero: ${genero || 'Não informado'}\n`;
            mensagem += `Aceitou os termos: ${termosAceitos}\n`;

            // Exibir alerta
            alert(mensagem);
        });
    </script>

</main>

<footer>
    <p>&copy; Gabriel Alexon 2026. Todos os direitos reservados.</p>
</footer>

</body>

</html>
