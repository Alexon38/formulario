<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    
    <form id="cadastroForm">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" required><br><br>
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="seu@email.com" required><br><br>
        
        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="1" max="120" placeholder="Sua idade" required><br><br>
        
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" required><br><br>
        
        <label for="estadoCivil">Estado Civil:</label>
        <select id="estadoCivil" required>
            <option value="">Selecione...</option>
            <option value="Solteiro(a)">Solteiro(a)</option>
            <option value="Casado(a)">Casado(a)</option>
            <option value="Divorciado(a)">Divorciado(a)</option>
            <option value="Viúvo(a)">Viúvo(a)</option>
        </select><br><br>
        
        <label>Gênero:</label>
        <input type="radio" id="masculino" name="genero" value="Masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="feminino" name="genero" value="Feminino">
        <label for="feminino">Feminino</label>
        <input type="radio" id="outro" name="genero" value="Outro">
        <label for="outro">Outro</label><br><br>
        
        <input type="checkbox" id="termos" required>
        <label for="termos">Aceito os termos e condições</label><br><br>
        
        <button type="submit">Enviar Formulário</button>
    </form>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const idade = document.getElementById('idade').value;
            const nascimento = document.getElementById('nascimento').value;
            const estadoCivil = document.getElementById('estadoCivil').value;
            
            let genero = '';
            const radios = document.getElementsByName('genero');
            for (let r of radios) if (r.checked) { genero = r.value; break; }
            
            const termos = document.getElementById('termos').checked ? 'Sim' : 'Não';
            
            let msg = `✅ Formulário enviado com sucesso!\n\n📋 Dados Informados:\n\n`;
            msg += `Nome: ${nome}\nE-mail: ${email}\nIdade: ${idade} anos\n`;
            msg += `Nascimento: ${nascimento}\nEstado Civil: ${estadoCivil}\n`;
            msg += `Gênero: ${genero || 'Não informado'}\nTermos: ${termos}`;
            
            alert(msg);
        });
    </script>
</body>
</html>
