<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo</title>
</head>

<body>
    <header>
        <h1>Formulário de Cadastro</h1>
    </header>


    <main>
        <form id="cadastroForm">

            <div>
                <!-- Nome completo -->
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div><!-- E-mail -->
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>


            <div> <!-- Idade -->
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Sua idade" required>
            </div>

            <div><!-- Data de nascimento -->
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>

            <div><!-- Estado Civil (Dropdown) -->
                <label for="estadoCivil">Estado Civil:</label>
                <select id="estadoCivil" name="estadoCivil" required>
                    <option value="">Selecione...</option>
                    <option value="Solteiro(a)">Solteiro(a)</option>
                    <option value="Casado(a)">Casado(a)</option>
                    <option value="Divorciado(a)">Divorciado(a)</option>
                    <option value="Viúvo(a)">Viúvo(a)</option>
                </select>
            </div>

            <!-- Gênero (Radio Buttons) -->
            <label>Gênero:</label>
            <div class="radio-group">
                <input type="radio" id="masculino" name="genero" value="Masculino">
                <label for="masculino">Masculino</label>
                <input type="radio" id="feminino" name="genero" value="Feminino">
                <label for="feminino">Feminino</label>
                <input type="radio" id="outro" name="genero" value="Outro">
                <label for="outro">Outro</label>
            </div>

            <!-- Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os termos e condições</label>
            </div>

            <button type="submit">Enviar Formulário</button>
        </form>

    </main>

    <footer>
        <p>&copy; Gabriel Alexon 2026. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
